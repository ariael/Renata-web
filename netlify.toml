[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback tu byl, dokud web tvorila jedina adresa. Ted ma kazda stranka
# vlastni soubor, takze by pravidlo jen vracelo uvodni stranku se stavem 200
# na kazdy preklep - vyhledavac by si takovou adresu ulozil jako platnou.
# Neznamou cestu proto obslouzi dist/404.html se spravnym stavovym kodem.

# Build výstup (/build/*) má hash v názvu – může se cachovat natrvalo.
[[headers]]
  for = "/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Obrázky z CMS mají pevný název, takže jen týden – aby se výměna fotky
# v administraci projevila návštěvníkům v rozumném čase.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# index.html se necachuje, aby se změny z CMS projevily hned po nasazení.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
