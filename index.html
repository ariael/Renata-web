<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>

  <!--
    Netlify Identity: pozvánky a obnova hesla přicházejí e-mailem jako odkaz na
    kořen webu (#invite_token=…). Widget proto načítáme jen v takovém případě,
    aby běžní návštěvníci nestahovali skript, který nikdy nepoužijí.
  -->
  <script>
    (function () {
      if (!/(invite_token|recovery_token|confirmation_token|email_change_token)=/.test(window.location.hash)) return;
      var s = document.createElement('script');
      s.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
      s.onload = function () {
        if (!window.netlifyIdentity) return;
        window.netlifyIdentity.on('init', function (user) {
          if (!user) {
            window.netlifyIdentity.on('login', function () {
              document.location.href = '/admin/';
            });
          }
        });
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
